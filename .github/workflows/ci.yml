name: offline-tests
on:
  push:
  pull_request:
permissions:
  contents: read
# CI is deliberately prevented from making any live vnstock requests.
env:
  VNPIPE_DISABLE_LIVE: '1'
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go -C go test -race ./...
      - run: go -C go vet ./...
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile py/vnstock_worker.py
      - run: python -c "import tomllib; tomllib.load(open('config/default.toml', 'rb'))"
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_USER: vnsignal
          POSTGRES_DB: vnsignal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U vnsignal -d vnsignal_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: postgresql://vnsignal:test_only@localhost:5432/vnsignal_test
      VNPIPE_TEST_DATABASE_NAME: vnsignal_test
      VNPIPE_REQUIRE_PARITY: '1'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: bash tests/sql/test_migration.sh
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      # This also runs the SQL/Polars parity check against the synthetic fixture
      # left by test_migration.sh. The fixture contains no real market data.
      - run: cargo test --manifest-path rust/Cargo.toml --workspace
      - run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f sql/diagnostics/ohlcv_quarantine.sql
      # Only the PostgreSQL integration job fetches pgx. Hosted CI never uses
      # user credentials, devices or live vnstock routes.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - run: go -C go mod download
      - run: go -C go run -mod=mod -tags postgres ./cmd/vnpipe migrate --dir ../sql/migrations
      - run: go -C go run -mod=mod -tags postgres ./cmd/vnpipe migrate --dir ../sql/migrations
      # Several integration fixtures intentionally mutate shared disposable DB state.
      - run: go -C go test -mod=mod -race -tags "postgres postgres_integration" -p 1 ./... -count=1
